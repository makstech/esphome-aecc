esphome:
  name: aecc-battery

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

web_server:
  version: 3

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

uart:
  - id: bus_inverter
    tx_pin: GPIO32
    rx_pin: GPIO33
    baud_rate: 9600
  - id: bus_meter
    tx_pin: GPIO25
    rx_pin: GPIO26
    baud_rate: 9600

aecc:
  id: nova
  uart_id: bus_inverter
  backup:
    url: /aecc/backup
  datalogger:
    host: 192.0.2.10          # the unit's own WiFi module, on your LAN
    resting_power: -300
    resting_power_number: Resting power
  meter:
    type: rs071
    uart_id: bus_meter
  control:
    rate: 2Hz
    grid_target: 60
    max_discharge: 600
    max_charge: 2400
    min_soc: 15%
    max_soc: 90%
    # Naming one turns it into a Home Assistant control, starting from the value above.
    setpoint_number: Battery power
    grid_target_number: Grid target
    max_discharge_number: Max discharge
    max_charge_number: Max charge
    min_soc_number: Reserve
    max_soc_number: Charge ceiling

  # Battery settings. The defaults for address, range, scale and unit come from the
  # component; override any of them the way soc_shutdown_number does here.
  grid_export_limit_number: Grid export limit
  max_charge_current_number: Max charge current
  soc_shutdown_number:
    name: Shut down at
    min_value: 5
    max_value: 50
  buzzer_mute_switch: Buzzer mute
  eco_mode_switch: Energy saving
  on_grid_mode_select: On-grid mode
  utility_range_select: Utility range

  # Anything the component does not model.
  registers:
    - name: Parallel mode
      address: 0xA02C
      max_value: 7

# Readings, control diagnostics and health are created automatically. This block is only
# needed to read a register the component does not model.
sensor:
  - platform: aecc
    registers:
      - name: Grid overvoltage trip
        address: 0xA04D
        scale: 0.1
        interval: 60s


# The backup button comes with `backup:`.
button:
  - platform: template
    name: Set battery type LiFePO4 16S
    entity_category: config
    on_press:
      - aecc.write_register:
          id: nova
          address: 0xA08C
          value: 6
