# Generated by tests/generate.py. Every key the component accepts, so CI covers the ones
# example.yaml does not name.
esphome:
  name: aecc-all-keys

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

# backup: serves over HTTP, which needs a network.
wifi:
  ssid: test
  password: testtesttest

web_server:
  version: 3

uart:
  - id: bus_inverter
    tx_pin: GPIO32
    rx_pin: GPIO33
    baud_rate: 9600
  - id: bus_meter
    tx_pin: GPIO25
    rx_pin: GPIO26
    baud_rate: 9600

aecc:
  id: nova
  uart_id: bus_inverter
  unit: 1
  expose_all_settings: true
  expose_tuning: false
  backup:
    url: /aecc/backup
    restore_url: /aecc/restore
    button: Take a backup
  trace:
    url: /aecc/trace
    duration: 30s
    button: Take a trace
  work_mode_select: Work mode
  datalogger:
    host: 192.0.2.10
    port: 8080
    resting_power: -50
    reconcile_interval: 60s
    host_text: Battery address
    enable_switch: Datalogger link
    resting_power_number: Resting power
  meter:
    type: rs071
    uart_id: bus_meter
    unit: 1
    register: 12
    reply_window: 120ms
  control:
    rate: 4Hz
    filter_window: 750ms
    law: predictive
    predictive_gain: 0.7
    actuator_lag: 400ms
    meter_delay: 300ms
    grid_target: 60
    max_discharge: 600
    max_charge: 2400
    min_soc: 15
    max_soc: 90
    ramp_up: 0.35
    stale_after: 5s
    mode_select: Battery mode
    setpoint_number: Battery power
    law_select: Control law
    rate_number: Loop rate
    filter_window_number: Filter window
    predictive_gain_number: Predictive gain
    meter_delay_number: Meter delay
    grid_target_number: grid target
    max_discharge_number: max discharge
    max_charge_number: max charge
    min_soc_number: min soc
    max_soc_number: max soc
  grid_export_limit_number: grid export limit
  output_voltage_number: output voltage
  output_frequency_number: output frequency
  max_charge_current_number: max charge current
  pv_max_charge_current_number: pv max charge current
  mains_max_charge_current_number: mains max charge current
  saturation_current_number: saturation current
  cv_voltage_number: cv voltage
  float_voltage_number: float voltage
  cv_charge_time_number: cv charge time
  cv_return_voltage_number: cv return voltage
  battery_to_mains_voltage_number: battery to mains voltage
  mains_to_battery_voltage_number: mains to battery voltage
  undervoltage_alarm_number: undervoltage alarm
  low_voltage_shutdown_number: low voltage shutdown
  eod_voltage_number: eod voltage
  shutdown_delay_number: shutdown delay
  eod_clear_voltage_number: eod clear voltage
  soc_low_alarm_number: soc low alarm
  soc_shutdown_number: soc shutdown
  soc_full_number: soc full
  soc_inverter_to_mains_number: soc inverter to mains
  soc_mains_to_inverter_number: soc mains to inverter
  device_power_switch: device power
  eco_mode_switch: eco mode
  buzzer_mute_switch: buzzer mute
  battery_activation_switch: battery activation
  mixing_priority_switch: mixing priority
  external_ct_host_switch: external ct host
  anti_islanding_switch: anti islanding
  bms_function_switch: bms function
  independent_pack_switch: independent pack
  utility_range_select: utility range
  inverter_mode_select: inverter mode
  battery_type_select: battery type
  parallel_mode_select: parallel mode
  bms_protocol_select: bms protocol
  charge_priority_select: charge priority
  grid_standard_select: grid standard
  on_grid_mode_select: on grid mode
  soc_sensor: Battery SOC
  battery_power_sensor: Battery power
  grid_power_sensor: Grid power
  backup_load_sensor: Backup load
  setpoint_sensor: Setpoint
  ac_charge_power_sensor: AC charge power
  pv_power_sensor: PV power
  energy_charged_sensor: Energy charged
  energy_discharged_sensor: Energy discharged
  meter_power_sensor: Meter grid power
  meter_power_filtered_sensor: Meter grid power, filtered
  commanded_power_sensor: Commanded power
  meter_age_sensor: Meter sample age
  loop_rate_sensor: Control loop rate
  control_effective_sensor: Setpoint honoured
  meter_ok_sensor: Meter OK
  ems_ready_sensor: Scheduler ready
  registers:
    - name: Parallel mode
      address: 0xA02C
      max_value: 7
    - name: Grid overvoltage trip
      address: 0xA04D
      scale: 0.1
      max_value: 300

sensor:
  - platform: aecc
    registers:
      - name: Grid overvoltage trip
        address: 0xA04D
        scale: 0.1
        interval: 60s
